name: AG-M0-01 one-time formatting and lockfile bootstrap

on:
  push:
    branches:
      - agent/AG-M0-01-svelte-vite-foundation
    paths:
      - .github/workflows/ag-m0-01-normalize.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/AG-M0-01-svelte-vite-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve and lock dependencies
        run: npm install --no-audit --no-fund
      - name: Normalize tracked code formatting
        run: npm run format
      - name: Verify all foundation checks
        run: npm run check
      - name: Commit verified formatted code and lockfile
        run: |
          rm -f .github/workflows/ag-m0-01-normalize.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(AG-M0-01): commit verified formatter output and npm lockfile'
          git push origin HEAD:agent/AG-M0-01-svelte-vite-foundation

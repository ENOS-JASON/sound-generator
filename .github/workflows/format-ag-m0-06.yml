name: Temporary format AG-M0-06
on:
  push:
    branches:
      - agent/ag-m0-06-configurator-contracts
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ag-m0-06-configurator-contracts
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/contracts/configurator/units.ts src/contracts/configurator/index.ts src/configurator/validation/index.ts tests/configurator.test.mjs
      - name: Commit formatting only when needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/contracts/configurator/units.ts src/contracts/configurator/index.ts src/configurator/validation/index.ts tests/configurator.test.mjs
            git commit -m "style(configurator): apply repository Prettier formatting"
            git push origin HEAD:agent/ag-m0-06-configurator-contracts
          fi

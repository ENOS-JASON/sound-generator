name: AG-M0-02 one-time branch formatting

on:
  push:
    branches:
      - agent/AG-M0-02-pages-deploy
    paths:
      - .github/workflows/ag-m0-02-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/AG-M0-02-pages-deploy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and format owned smoke fixture
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write tests/pages-smoke.mjs
      - name: Commit formatting and remove one-time helper
        run: |
          rm -f .github/workflows/ag-m0-02-format-once.yml
          git add -A
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(AG-M0-02): format Pages smoke tests'
          git push origin HEAD:agent/AG-M0-02-pages-deploy

name: Verify and deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, build and test Pages preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck, lint, format, test and build
        run: npm run check
      - name: Verify Vite Pages asset paths
        run: node tests/pages-smoke.mjs static
      - name: Smoke test direct hash links and refresh over HTTPS in Chromium
        run: node tests/pages-smoke.mjs https
      - name: Save build for PR inspection
        uses: actions/upload-artifact@v4
        with:
          name: ag-m0-02-static-site
          path: dist/
          if-no-files-found: error
      - name: Package Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    name: Deploy and verify public Pages site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy built Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Smoke test public HTTPS route and assets without credentials
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/pages-smoke.mjs live

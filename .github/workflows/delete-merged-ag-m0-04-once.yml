name: One-time delete merged AG-M0-04 branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/delete-merged-ag-m0-04-once.yml

permissions:
  contents: write

jobs:
  delete-merged-branch:
    runs-on: ubuntu-latest
    if: github.repository == 'ENOS-JASON/sound-generator'
    steps:
      - name: Verify merged PR and unmodified branch, then delete ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          expected_head="bfafb5c8b721655f4678431248ea3f43a92ab4ae"
          expected_merge="c13aa946156c8965870c8653ddae881d90531561"
          pr_merged="$(gh api "repos/${repo}/pulls/6" --jq '.merged')"
          pr_head="$(gh api "repos/${repo}/pulls/6" --jq '.head.sha')"
          pr_merge="$(gh api "repos/${repo}/pulls/6" --jq '.merge_commit_sha')"
          if [[ "${pr_merged}" != "true" || "${pr_head}" != "${expected_head}" || "${pr_merge}" != "${expected_merge}" ]]; then
            echo "PR #6 merge verification failed; branch untouched"
            exit 1
          fi
          branch_head="$(gh api "repos/${repo}/git/ref/heads/agent/ag-m0-04-port-graph-contracts" --jq '.object.sha')"
          if [[ "${branch_head}" != "${expected_head}" ]]; then
            echo "Feature branch moved after merge; branch untouched"
            exit 1
          fi
          gh api --method DELETE "repos/${repo}/git/refs/heads/agent/ag-m0-04-port-graph-contracts"
          echo "Deleted verified merged branch"

name: Temporary AG-M0-03 formatting
on:
  push:
    branches:
      - agent/AG-M0-03-vehicle-schema-v2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/AG-M0-03-vehicle-schema-v2
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format owned AG-M0-03 sources and fixtures
        run: npx prettier --write src/contracts/ tests/contracts.test.mjs tests/fixtures/contracts/
      - name: Push formatting commit to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contracts tests/contracts.test.mjs tests/fixtures/contracts
          if ! git diff --cached --quiet; then
            git commit -m "style(AG-M0-03): normalize contract and fixture formatting"
            git push origin HEAD:agent/AG-M0-03-vehicle-schema-v2
          fi
